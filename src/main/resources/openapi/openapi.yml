openapi: 3.1.0
info:
  title: Task Management API
  description: API for managing users, tasks, and authentication in a task management system.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1 # Base URL for all endpoints under /api/v1
    description: Local Development Server

tags: # To organize endpoints in Swagger UI
  - name: Authentication
    description: User authentication and registration operations
  - name: User Management
    description: Operations for managing users (Admin only)
  - name: Task Management
    description: Operations for managing tasks

security:
  - bearerAuth: [] # Global security applied, but overridden by operation if `permitAll`

paths:
  # --- Authentication Endpoints ---

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: A new user is registered in the system.
      operationId: registerUser
      requestBody:
        description: Register user details to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully, returns JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid input or user already exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrors'
                  - $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user and get JWT token
      description: The user is authenticated and the JWT token is returned.
      operationId: loginUser
      requestBody:
        description: User details to login.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successful, returns JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  # --- User Management Endpoints (Admin Only) ---
  /users:
    get:
      tags:
        - User Management
      summary: Get all users (Admin only)
      description: Retrieves a list of all registered users.
      operationId: getAllUsers
      security:
        - bearerAuth: [] # Required JWT
      responses:
        '200':
          description: Successfully retrieved list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized - missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden - Insufficient permissions (Requires ADMIN role).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

    post:
      tags:
        - User Management
      summary: Create a new user (Admin only)
      description: A new user is created in the system.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        description: User details to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input or username/email already exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrors'
                  - $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden - Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /users/{id}:
    get:
      tags:
        - User Management
      summary: Get a user by ID (Admin only)
      description: Retrieves a registered user by their ID.
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the user to retrieve.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden - Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

    put:
      tags:
        - User Management
      summary: Update an existing user by ID (Admin only)
      description: Updates the information of an existing user in the system.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the user to update.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated user details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrors'
                  - $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden - Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

    delete:
      tags:
        - User Management
      summary: Delete a user by ID (Admin only)
      description: Deletes a specific user from the system.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the user to delete.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User deleted successfully.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden - Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  # --- Task Management Endpoints ---
  /tasks:
    get:
      tags:
        - Task Management
      summary: Get all tasks
      description: Retrieves all registered tasks.
      operationId: getAllTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved list of tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

    post:
      tags:
        - Task Management
      summary: Create a new task
      description: Creates a new task associated with a user.
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        description: Task details to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid input (e.g., non-existent statusId or userId).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrors'
                  - $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /tasks/{id}:
    get:
      tags:
        - Task Management
      summary: Get a task by ID
      description: Obtains data on a specific task.
      operationId: getTaskById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the task to retrieve.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

    put:
      tags:
        - Task Management
      summary: Update an existing task by ID
      description: Updates the information of a specific task.
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the task to update.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated task details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid input (e.g., non-existent statusId or userId).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrors'
                  - $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

    delete:
      tags:
        - Task Management
      summary: Delete a task by ID
      description: Removes a specific task from the system.
      operationId: deleteTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the task to delete.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Task deleted successfully.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

  /tasks/user/{userId}:
    get:
      tags:
        - Task Management
      summary: Get tasks by user ID
      description: Retrieves a list of tasks assigned to a specific user.
      operationId: getTasksByUserId
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          description: ID of the user whose tasks are to be retrieved.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved tasks for the specified user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- Authentication DTOs ---
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          example: newUser
          minLength: 3
          maxLength: 50
        password:
          type: string
          example: StrongPass123!
          minLength: 6
          maxLength: 100
        role:
          type: string
          pattern: "^(ROLE_ADMIN|ROLE_USER)$"
          example: ROLE_USER
      required:
        - username
        - password
        - role

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin123*+
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Access Token
          example: eyJhbGciOiJIUzI1Ni...
      required:
        - token

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        role:
          type: string
          example: ROLE_ADMIN
        dateCreation:
          type: string
          format: date-time
          example: 2025-07-12T18:32:37Z
      required:
        - id
        - username
        - role
        - dateCreation

    # --- User DTOs ---
    UserRequest:
      type: object
      properties:
        username:
          type: string
          example: updatedUser
          minLength: 3
          maxLength: 50
        password:
          type: string
          example: NewSecurePassword123!
          minLength: 6
          maxLength: 100
        role:
          type: string
          pattern: "^(ROLE_ADMIN|ROLE_USER)$"
          example: ROLE_USER
      required:
        - username
        - password
        - role

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        role:
          type: string
          example: ROLE_ADMIN
        dateCreation:
          type: string
          format: date-time
          example: 2025-07-12T18:32:37Z
      required:
        - id
        - username
        - role
        - dateCreation

    # --- Task DTOs ---
    TaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 0
          maxLength: 100
          example: Finish Project Report
        description:
          type: string
          minLength: 0
          maxLength: 500
          example: Complete the quarterly report for the new project.
        statusId:
          type: integer
          format: int64
          description: ID of the task status (e.g., 1 for To Do, 2 for In Progress).
          example: 1
        userId:
          type: integer
          format: int64
          description: ID of the user assigned to this task.
          example: 2
        dueDate:
          type: string
          format: date # YYYY-MM-DD
          example: 2025-12-31
      required:
        - title
        - description
        - statusId
        - userId

    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        code:
          type: string
          example: TASK-001
        title:
          type: string
          example: Finish Project Report
        description:
          type: string
          example: Complete the quarterly report for the new project.
        status:
          type: string
          example: TO_DO
        user:
          type: string
          example: JohnDoe
        dueDate:
          type: string
          format: date
          example: 2025-12-31
        createdAt:
          type: string
          format: date-time
          example: 2025-07-12T18:32:37Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-07-12T19:00:00Z
      required:
        - id
        - code
        - title
        - description
        - status
        - user
        - dueDate
        - createdAt
        - updatedAt

    # --- Error Handling ---
    ErrorDetails:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2025-07-12T10:30:00.000+00:00
        message:
          type: string
          example: Resource not found.
        details:
          type: string
          example: No task found with ID 123.
        errorCode:
          type: string
          example: NOT_FOUND.
      required:
        - timestamp
        - message
        - details
        - errorCode

    ValidationErrors:
      type: object
      description: A map of field names to their validation error messages.
      additionalProperties:
        type: string
      example:
        username: "Username must be between 3 and 50 characters"
        password: "Password must be at least 6 characters"