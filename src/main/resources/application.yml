spring:
  datasource:
    url: jdbc:h2:mem:tasksdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql

logging:
  level:
    org.springframework: INFO
    org.springdoc: INFO
