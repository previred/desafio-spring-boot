spring:
  application:
    name: desafio-tareas
  
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  sql:
    init:
      mode: always

security:
  jwt:
    secret-key: nuevospa-secret-key-for-jwt-token-generation-2026-very-secure-and-long-key
    expiration-time: 86400000

# Server 
server:
  port: 8080
  servlet:
    context-path: /

# Springdoc OpenAPI 
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha


password:
  regex: "^(?=.*[A-Z])(?=.*\\d)[A-Za-z\\d]{8,}$"
