openapi: 3.0.0
info:
  title: Desafio Técnico - API Gestión de tareas
  version: 1.0.0
  description: API Gestión de tareas.

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

paths:

  /token:
    post:
      summary: Obtener token.
      operationId: token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales inválidas

  /tasks:
    post:
      summary: Crear una tarea
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

    get:
      summary: Listar tareas
      operationId: listTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'

  /tasks/{taskId}:
    parameters:
      - in: path
        name: taskId
        required: true
        schema:
          type: string

    get:
      summary: Obtener tarea segun Id
      operationId: getTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Tarea no encontrada

    put:
      summary: Actualizar una tarea
      operationId: updateTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

    delete:
      summary: Eliminar tarea
      operationId: deleteTask
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tarea eliminada

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    TokenRequest:
      type: object
      properties:
        username:
          type: string
          example: "nombre_usurio"
        password:
          type: string
          example: "clave_usuario"
      required:
        - username
        - password

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbCM11DDUzRDDDTT555sInR5cCI6Ikww34..."

    TaskRequest:
      type: object
      properties:
        title:
          type: string
          example: "Algun titulo"
        description:
          type: string
          example: "Descripcion de la tarea"
        createdBy:
          type: string
          example: "username"
      required:
        - title
        - description
        - createdBy

    TaskResponse:
      allOf:
        - $ref: '#/components/schemas/TaskRequest'
        - type: object
          properties:
            id:
              type: string
              example: "abc-1"
            status:
              type: string
              example: "done"
            createdAt:
              type: string
              format: date-time
              example: "2025-04-07T14:35:00Z"
            lastUpdate:
              type: string
              format: date-time
              example: "2025-04-07T14:36:00Z"
