spring:
  application:
    name: desafio-spring-boot
  datasource:
    url: jdbc:h2:mem:previred_db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
      console:
        enabled: true
        path: /h2-console
  jpa:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      defer-datasource-initialization: true
      properties:
        hibernate:
          format_sql: true
