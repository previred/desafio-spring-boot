spring.application.name=task-management

server.port=8080

spring.datasource.url=jdbc:h2:mem:task-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.uuid_generator_strategy=time-based
spring.jpa.defer-datasource-initialization=true

app.jwtsecret=SecretKeyToGenJWTsSecretKeyToGenJWTsSecretKeyToGenJWTs
app.jwtexpirationmilliseconds=86400000