openapi: 3.1.1
info:
  title: API Usuarios y Tareas
  version: 1.0.0
  description: API para gestionar usuarios y tareas

servers:
  - url: http://localhost:8080/tarea

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        nombre:
          type: string
        clave:
          type: string
      required:
        - nombre
        - clave

    JwtResponse:
      type: object
      properties:
        token:
          type: string

    Tarea:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
        estados:
          type: string
          enum: [Pendiente, En_desarrollo, Finalizada]
      required:
        - titulo
        - descripcion
        - estados

paths:

  /tarea/login:
    post:
      summary: Autenticación de usuarios
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '200':
          description: JWT generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '401':
          description: Usuario o contraseña invalidos

  /tarea:
    get:
      summary: Obtiene una lista de todas las tareas
      tags: [Tarea]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listar tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
        '401':
          description: No autorizado

    post:
      summary: Crear una nueva tarea
      tags: [Tarea]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tarea'
      responses:
        '201':
          description: Tarea creada exitosamente
        '400':
          description: Error en los datos enviados
        '401':
          description: No autorizado

  /tarea/{id}:
    put:
      summary: Actualizar una tarea
      tags: [Tarea]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tarea'
      responses:
        '200':
          description: Tarea actualizada
        '404':
          description: Tarea no encontrada
        '401':
          description: No autorizado

    delete:
      summary: Elimina una tarea
      tags: [Tarea]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Tarea eliminada
        '404':
          description: La tarea no fue encontrada
        '401':
          description: No autorizado
