version: '3.8'
services:
  task-manager:
    build: .
    image: task-manager:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/managementtask_dev_db
      - SPRING_DATASOURCE_USERNAME=usr_previred
      - SPRING_DATASOURCE_PASSWORD=admin123
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_DB: managementtask_dev_db
      POSTGRES_USER: usr_previred
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: