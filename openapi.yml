openapi: 3.0.3
info:
  title: Sistema de Gestión de Tareas - Previred
  description: |
    API RESTful para gestión de tareas desarrollada con Spring Boot 3.5.0 y Java 21.
    Utiliza autenticación JWT Bearer Token.

    ## Postulante
    - **Nombre:** Luis Martinez
    - **Correo:** l.martinezm22@gmail.com
    - **Cargo:** Desarrollador Backend Java
  version: 1.0.0
  contact:
    name: Luis Martinez
    email: l.martinezm22@gmail.com

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

tags:
  - name: Autenticacion
    description: Operaciones de autenticación y generación de token JWT
  - name: Tareas
    description: Operaciones CRUD sobre tareas

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags:
        - Autenticacion
      operationId: login
      summary: Autenticación de usuario
      description: Autentica un usuario con email y contraseña, retorna un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@previred.com
              password: Previred2026
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tareas:
    get:
      tags:
        - Tareas
      operationId: obtenerTodasLasTareas
      summary: Listar todas las tareas
      description: Obtiene la lista completa de tareas del sistema
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tareas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TareaResponse'
        '401':
          description: No autorizado - Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tarea:
    post:
      tags:
        - Tareas
      operationId: crearTarea
      summary: Crear una nueva tarea
      description: Crea una nueva tarea en el sistema. El usuario se obtiene del token JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaRequest'
            example:
              titulo: Comprar repuestos
              descripcion: Comprar repuestos para el auto
              prioridad: ALTA
              estadoId: 1
      responses:
        '201':
          description: Tarea creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacionResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tarea/{id}:
    get:
      tags:
        - Tareas
      operationId: obtenerTareaPorId
      summary: Obtener una tarea por ID
      description: Obtiene los detalles de una tarea específica
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la tarea
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaResponse'
        '404':
          description: Tarea no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Tareas
      operationId: actualizarTarea
      summary: Actualizar una tarea
      description: Actualiza los datos de una tarea existente. El usuario se obtiene del token JWT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la tarea a actualizar
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TareaRequest'
            example:
              titulo: Tarea actualizada
              descripcion: Descripción actualizada
              prioridad: MEDIA
              estadoId: 2
      responses:
        '200':
          description: Tarea actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TareaResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacionResponse'
        '404':
          description: Tarea no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Tareas
      operationId: eliminarTarea
      summary: Eliminar una tarea
      description: Elimina una tarea del sistema por su ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la tarea a eliminar
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Tarea eliminada exitosamente
        '404':
          description: Tarea no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido desde /auth/login

  schemas:

    LoginRequest:
      type: object
      description: Credenciales de acceso del usuario
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          example: admin@previred.com
        password:
          type: string
          description: Contraseña del usuario (mínimo 8 caracteres, una mayúscula y un número)
          example: Previred2026
          minLength: 8
          pattern: '^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$'

    LoginResponse:
      type: object
      description: Respuesta del login con token JWT
      properties:
        token:
          type: string
          description: Token JWT para autenticación
          example: eyJhbGciOiJIUzI1NiJ9...
        username:
          type: string
          description: Nombre de usuario
          example: admin
        email:
          type: string
          format: email
          description: Email del usuario
          example: admin@previred.com

    TareaRequest:
      type: object
      description: Datos para crear o actualizar una tarea
      required:
        - titulo
        - descripcion
      properties:
        titulo:
          type: string
          description: Título de la tarea
          example: Comprar repuestos
          maxLength: 100
        descripcion:
          type: string
          description: Descripción detallada de la tarea
          example: Comprar repuestos para el auto
          maxLength: 500
        prioridad:
          type: string
          description: Nivel de prioridad de la tarea
          enum:
            - BAJA
            - MEDIA
            - ALTA
          example: ALTA
        estadoId:
          type: integer
          format: int64
          description: ID del estado de la tarea
          example: 1

    TareaResponse:
      type: object
      description: Datos de respuesta de una tarea
      properties:
        id:
          type: integer
          format: int64
          description: ID único de la tarea
          example: 1
        titulo:
          type: string
          description: Título de la tarea
          example: Comprar repuestos
        descripcion:
          type: string
          description: Descripción de la tarea
          example: Comprar repuestos para el auto
        fechaCreacion:
          type: string
          format: date-time
          description: Fecha y hora de creación de la tarea (OffsetDateTime)
          example: 2026-03-06T15:30:00+00:00
        prioridad:
          type: string
          description: Nivel de prioridad
          enum:
            - BAJA
            - MEDIA
            - ALTA
          example: ALTA
        estadoNombre:
          type: string
          description: Nombre del estado de la tarea
          example: PENDIENTE
        nombreUsuario:
          type: string
          description: Nombre del usuario asignado a la tarea
          example: admin

    ErrorResponse:
      type: object
      description: Respuesta de error genérica
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error
          example: 2026-03-06T15:30:00
        status:
          type: integer
          description: Código HTTP del error
          example: 404
        error:
          type: string
          description: Tipo de error HTTP
          example: Not Found
        message:
          type: string
          description: Mensaje descriptivo del error
          example: Tarea no encontrada id 1

    ErrorValidacionResponse:
      type: object
      description: Respuesta de error de validación con detalle por campo
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2026-03-06T15:30:00
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Datos invalidos
        errors:
          type: array
          description: Lista de errores por campo
          items:
            type: object
            properties:
              field:
                type: string
                description: Campo que falló la validación
                example: prioridad
              message:
                type: string
                description: Mensaje del error de validación
                example: La prioridad debe ser BAJA, MEDIA o ALTA
